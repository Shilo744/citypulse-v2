<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityPulse · גלריית גרפים</title>
<link rel="icon" type="image/png" href="assets/logo/favicon-64.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/viz.css">
<script>
  try {
    if (new URLSearchParams(location.search).get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("js-motion");
  } catch (e) { /* old browser */ }
</script>
<style>
  /* the gallery is a developer page: every chart module shows itself here with real data (the page of a real locality) */
  .gal { max-width: 1180px; margin: 0 auto; padding: 28px 24px 90px; }
  .gal-sec { margin-top: 40px; }
  .gal-sec > h2 { padding-bottom: 8px; border-bottom: 1px solid var(--line-2); margin-bottom: 18px; }
  .gal-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-items: start; }
  .gal-demo { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
  .gal-demo > .sub { margin: 2px 0 12px; }
  .gal-demo > h3 { margin-bottom: 2px; }
  code { direction: ltr; unicode-bidi: isolate; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-size: .9em; }
</style>
</head>
<body>
<main class="gal" id="gallery">
  <h1 class="h1">גלריית הגרפים</h1>
  <p class="lede">כל גרף מוצג כאן עם נתונים אמיתיים. <code>?family=rings</code> מציג משפחה אחת, <code>?theme=dark</code> מצב כהה, <code>?city=3000</code> יישוב אחר.</p>
</main>
<script type="module" src="js/motion.js"></script>
<script type="module" src="js/gallery.js"></script>
</body>
</html>
