<!-- one request instead of 39: the server (src/lib/css-bundle.js, list in src/lib/config.js) inlines the @imports of these six sheets in this order: app, motion, layout, viz, pages-n, product; where the route does not exist the sheets load one by one -->
<link rel="stylesheet" href="css/n.bundle.css" onerror="this.onerror=null;['app','motion','layout','viz','pages-n','product'].forEach(function(n){var l=document.createElement('link');l.rel='stylesheet';l.href='css/'+n+'.css';document.head.appendChild(l)});this.remove()">
<script>
  /* light unless the person chose dark; set before first paint so the page never flashes */
  document.documentElement.dataset.theme = "light";          /* the product is light only: no toggle, and a dark system setting is not followed */
  /* motion unless the system asks for less: the hidden start states of css/motion.css exist only under this class */
  try { if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("js-motion"); } catch (e) { /* old browser */ }
</script>
